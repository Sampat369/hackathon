[project]
name = "evidenceiq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1", "asyncpg>=0.29,<1", "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1", "chromadb>=0.5,<1", "pdfplumber>=0.11,<1", "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2", "pytesseract>=0.3,<1", "Pillow>=10,<12", "faster-whisper>=1,<2",
  "reportlab>=4,<5", "python-magic>=0.4.27", "orjson>=3.10,<4"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "asgi-lifespan>=2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
